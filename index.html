<!-- Контейнер, который выравнивает кнопку по центру экрана -->
<div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <button id="rickBtn" style="padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #ff0000; color: white; border: none; border-radius: 8px; font-weight: bold;">
        Нажми на меня! 🎬
    </button>
</div>

<!-- Контейнер для видео (скрыт по умолчанию) -->
<div id="videoContainer" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 9999; justify-content: center; align-items: center;">
    <!-- Видеофайл подключен с именем rikrol.mp4 -->
    <video id="rickVideo" width="100%" height="100%" style="object-fit: contain;" controls autoplay>
        <source src="rikrol.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
    </video>
</div>
<script>
    const btn = document.getElementById('rickBtn');
    const container = document.getElementById('videoContainer');
    const video = document.getElementById('rickVideo');

    btn.addEventListener('click', () => {
        // Показываем контейнер с видео
        container.style.display = 'flex';
        
        // Перезапускаем видео с самого начала
        video.currentTime = 0;
        video.play().catch(error => {
            console.log("Автозапуск заблокирован браузером:", error);
        });

        // Включаем полноэкранный режим сайта
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
            document.documentElement.webkitRequestFullscreen();
        } else if (document.documentElement.msRequestFullscreen) { /* IE11 */
            document.documentElement.msRequestFullscreen();
        }
    });
</script>
