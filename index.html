<!-- Кнопка для запуска -->
<button id="rickBtn" style="padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #ff0000; color: white; border: none; border-radius: 8px; font-weight: bold;">
    Нажми на меня! 🎬
</button>

<!-- Контейнер для видео (скрыт по умолчанию) -->
<div id="videoContainer" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 9999; justify-content: center; align-items: center;">
    <!-- Используем тег video вместо iframe -->
    <video id="localVideo" width="100%" height="100%" style="object-fit: cover;" controls>
        <!-- Укажи правильное имя файла вместо video.mp4 -->
        <source src="rikrol.mp4" type="rikrol.mp4">
        Ваш браузер не поддерживает видео.
    </video>
</div>

<script>
    const btn = document.getElementById('rickBtn');
    const container = document.getElementById('videoContainer');
    const video = document.getElementById('localVideo');

    btn.addEventListener('click', () => {
        // Показываем контейнер
        container.style.display = 'flex';
        
        // Запускаем воспроизведение
        video.play().catch(error => {
            console.log("Автозапуск был заблокирован браузером:", error);
        });

        // Включаем полноэкранный режим браузера
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
            document.documentElement.webkitRequestFullscreen();
        } else if (document.documentElement.msRequestFullscreen) {
            document.documentElement.msRequestFullscreen();
        }
    });
</script>
