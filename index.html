<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сюрприз 😈</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .start {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        h1 {
            font-size: 35px;
        }

        button {
            padding: 18px 45px;
            font-size: 24px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            transform: scale(1.05);
        }

        #result {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;

            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #ff00cc,
                #3333ff,
                #00ffff
            );
        }

        #resultText {
            color: white;
            font-size: clamp(60px, 15vw, 220px);
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="start" id="start">
        <h1>Нажми на кнопку 👇</h1>
        <button onclick="showResult()">НАЖМИ</button>
    </div>

    <div id="result">
        <div id="resultText">ТЫ БЬ</div>
    </div>

    <script>
        function showResult() {
            document.getElementById("start").style.display = "none";
            document.getElementById("result").style.display = "flex";
        }
    </script>

</body>
</html>
